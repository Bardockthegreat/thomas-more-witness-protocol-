<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none';">
<title>Morus — Review</title>
<style>
/*
  MORUS — Review witness files
  Version 1.0

  Drop in .morus files from multiple witnesses who never spoke to each other.
  See their accounts on a single timeline. Find where they align.

  This file belongs to no one. Copy it. Fork it. Give it away.
*/

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #faf9f7;
  color: #1a1a1a;
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.6;
  display: flex;
  flex-direction: column;
}

/* ── Header ── */
.header {
  padding: 16px 24px 16px;
  border-bottom: 1px solid #e5e7eb;
  flex-shrink: 0;
  display: flex;
  align-items: baseline;
  gap: 12px;
}
.logo { font-size: 17px; font-weight: 700; letter-spacing: 0.1em; color: #1e4d2b; }
.logo-sub { font-size: 11px; color: #9ca3af; }

/* ── Layout ── */
.layout {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  width: 300px;
  flex-shrink: 0;
  border-right: 1px solid #e5e7eb;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-head {
  padding: 16px;
  border-bottom: 1px solid #f3f4f6;
  font-size: 12px;
  font-weight: 600;
  color: #374151;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  flex-shrink: 0;
}
.drop-zone {
  margin: 12px;
  border: 2px dashed #d1d5db;
  border-radius: 8px;
  padding: 20px 12px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  flex-shrink: 0;
  user-select: none;
}
.drop-zone:hover, .drop-zone.dragover {
  border-color: #1e4d2b;
  background: #f0fdf4;
}
.drop-zone-icon { font-size: 18px; margin-bottom: 6px; }
.drop-zone-text { font-size: 12px; color: #6b7280; }
.drop-zone-sub { font-size: 10px; color: #9ca3af; margin-top: 3px; }

.file-list { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
.file-card {
  border: 1px solid #e5e7eb;
  border-radius: 7px;
  margin-bottom: 10px;
  overflow: hidden;
  background: #fff;
}
.file-card-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  background: #fafafa;
  border-bottom: 1px solid #f3f4f6;
}
.file-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.file-name {
  font-size: 12px;
  color: #374151;
  font-weight: 500;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.file-remove {
  background: none;
  border: none;
  cursor: pointer;
  color: #9ca3af;
  font-size: 14px;
  padding: 0 2px;
  line-height: 1;
  flex-shrink: 0;
}
.file-remove:hover { color: #dc2626; }
.file-card-body { padding: 10px 12px; }
.file-pwd-row { display: flex; gap: 6px; }
.file-pwd-input {
  flex: 1;
  padding: 7px 10px;
  border: 1px solid #d1d5db;
  border-radius: 4px;
  font-family: inherit;
  font-size: 12px;
  outline: none;
  min-width: 0;
}
.file-pwd-input:focus { border-color: #1e4d2b; }
.file-load-btn {
  padding: 7px 12px;
  background: #1e4d2b;
  color: #fff;
  border: none;
  border-radius: 4px;
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
}
.file-load-btn:disabled { opacity: 0.35; cursor: default; }
.file-status {
  margin-top: 8px;
  font-size: 11px;
  color: #6b7280;
}
.file-status.ok { color: #166534; }
.file-status.err { color: #dc2626; }

.sidebar-footer {
  padding: 12px;
  border-top: 1px solid #f3f4f6;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.export-btn {
  width: 100%;
  padding: 9px;
  background: #1e4d2b;
  color: #fff;
  border: none;
  border-radius: 5px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
.export-btn:disabled { opacity: 0.3; cursor: default; }
.export-btn:hover:not(:disabled) { opacity: 0.88; }

/* ── Timeline ── */
.timeline-wrap {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}
.timeline-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: #9ca3af;
  text-align: center;
  gap: 8px;
}
.timeline-empty-icon { font-size: 32px; }
.timeline-empty-title { font-size: 14px; font-style: italic; }
.timeline-empty-sub { font-size: 12px; }

.timeline-stats {
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}
.stat { font-size: 12px; color: #6b7280; }
.stat strong { color: #1a1a1a; }
.corroborating-badge {
  background: #fef3c7;
  border: 1px solid #fcd34d;
  border-radius: 12px;
  padding: 3px 10px;
  font-size: 11px;
  color: #92400e;
  font-weight: 500;
}

.timeline-item {
  display: flex;
  gap: 14px;
  padding: 14px 0;
  border-bottom: 1px solid #f3f4f6;
  position: relative;
}
.timeline-item.corroborating { background: #fffbeb; margin: 0 -8px; padding: 14px 8px; border-radius: 4px; border-bottom-color: transparent; border-bottom: 1px solid #fef3c7; }
.timeline-marker {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex-shrink: 0;
  gap: 4px;
  padding-top: 2px;
}
.timeline-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  flex-shrink: 0;
}
.timeline-corr-icon {
  font-size: 9px;
  color: #92400e;
}
.timeline-body { flex: 1; min-width: 0; }
.timeline-text {
  font-size: 13px;
  color: #1a1a1a;
  line-height: 1.55;
  margin-bottom: 4px;
  white-space: pre-wrap;
  word-break: break-word;
}
.timeline-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.timeline-time {
  font-size: 10px;
  color: #9ca3af;
  font-family: ui-monospace, 'Courier New', monospace;
}
.timeline-source {
  font-size: 10px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 10px;
  white-space: nowrap;
}
.corr-group-divider {
  margin: 4px 0;
  padding: 4px 8px;
  background: #fef3c7;
  border-left: 3px solid #f59e0b;
  font-size: 11px;
  color: #92400e;
  font-weight: 500;
  border-radius: 0 4px 4px 0;
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: #1a1a1a;
  color: #fff;
  padding: 10px 18px;
  border-radius: 6px;
  font-size: 12px;
  z-index: 200;
  opacity: 0;
  transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.file-input-hidden { display: none; }
</style>
</head>
<body>

<header class="header">
  <span class="logo">MORUS</span>
  <span class="logo-sub">review witness files</span>
</header>

<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-head">Witness Files</div>
    <div class="drop-zone" id="drop-zone">
      <div class="drop-zone-icon">📂</div>
      <div class="drop-zone-text">Drop .morus files here</div>
      <div class="drop-zone-sub">or click to choose files</div>
    </div>
    <input type="file" class="file-input-hidden" id="file-input" accept=".morus,application/json" multiple>
    <div class="file-list" id="file-list"></div>
    <div class="sidebar-footer">
      <button class="export-btn" id="export-btn" disabled>Export combined report</button>
    </div>
  </aside>

  <!-- Timeline -->
  <div class="timeline-wrap" id="timeline-wrap">
    <div class="timeline-empty">
      <div class="timeline-empty-icon">📋</div>
      <div class="timeline-empty-title">No files loaded yet</div>
      <div class="timeline-empty-sub">Add .morus files on the left to see the timeline</div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/*
  HOW THIS WORKS
  ─────────────────────────────────────────────────────────────
  Load .morus files from any number of witnesses.
  Enter the password for each file to decrypt it.
  The timeline shows all entries sorted by time.
  Entries from different witnesses recorded within 5 minutes
  of each other are flagged as corroborating.

  Nothing is sent anywhere. Everything runs in this tab.
  ─────────────────────────────────────────────────────────────
*/

// Source colors — distinguishable, accessible
const COLORS = [
  '#1e4d2b','#1e40af','#7c2d12','#4c1d95','#064e3b',
  '#713f12','#0c4a6e','#831843','#1c1917','#14532d'
]

// ── State ─────────────────────────────────────────────────────────────────────
let sources = []  // { id, filename, color, label, entries, loaded }
let nextId = 0

// ── Crypto ────────────────────────────────────────────────────────────────────
function toHex(arr) {
  return Array.from(new Uint8Array(arr)).map(b => b.toString(16).padStart(2,'0')).join('')
}
function fromHex(hex) {
  if (typeof hex !== 'string' || hex.length % 2 !== 0 || !/^[0-9a-fA-F]*$/.test(hex)) {
    throw new Error('invalid hex data in file')
  }
  const out = new Uint8Array(hex.length / 2)
  for (let i = 0; i < hex.length; i += 2) out[i/2] = parseInt(hex.slice(i, i+2), 16)
  return out
}

async function deriveKey(password, salt, iterations) {
  const iters = Math.max(600000, (iterations | 0) || 600000)
  const raw = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey'])
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: iters, hash: 'SHA-256' },
    raw, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
  )
}

async function decrypt(password, saltHex, ivHex, dataHex, iterations) {
  const key = await deriveKey(password, fromHex(saltHex), iterations)
  const pt  = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromHex(ivHex) }, key, fromHex(dataHex))
  return new TextDecoder().decode(pt)
}

async function sha256hex(str) {
  return toHex(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)))
}

async function verifyChain(entries, expectedHead) {
  // Validate sequence numbers are consecutive starting at 1
  let seqOk = true
  for (let i = 0; i < entries.length; i++) {
    if (entries[i].seq !== i + 1) { seqOk = false; break }
  }
  let prev = '0'.repeat(64)
  let allValid = true
  for (const e of entries) {
    const expected = await sha256hex(JSON.stringify({ prev, seq: e.seq, ts: e.timestamp, text: e.text }))
    if (expected !== e.hash) { allValid = false }
    prev = e.hash
  }
  // Verify declared head matches computed final hash
  const computedHead = entries.length > 0 ? entries[entries.length - 1].hash : '0'.repeat(64)
  const headOk = !expectedHead || computedHead === expectedHead
  return allValid && seqOk && headOk
}

// ── Source management ─────────────────────────────────────────────────────────
function addFiles(files) {
  for (const file of files) {
    if (sources.find(s => s.filename === file.name)) continue  // skip all dupes, loaded or not
    if (file.size > 10 * 1024 * 1024) { showToast(`${esc(file.name)} is too large (max 10 MB)`); continue }
    const id    = nextId++
    const color = COLORS[sources.length % COLORS.length]
    const label = `W${sources.length + 1}`
    sources.push({ id, filename: file.name, file, color, label, entries: [], loaded: false, valid: null })
    renderSidebar()
  }
}

function removeSource(id) {
  sources = sources.filter(s => s.id !== id)
  renderTimeline()
  renderSidebar()
  updateExportBtn()
}

async function loadSource(id) {
  const src = sources.find(s => s.id === id)
  if (!src) return
  const pwdEl = document.getElementById(`pwd-${id}`)
  const statusEl = document.getElementById(`status-${id}`)
  const btn = document.getElementById(`load-${id}`)
  const pwd = pwdEl.value.trim()
  if (!pwd) return
  btn.disabled = true; btn.textContent = 'Loading...'
  statusEl.textContent = ''; statusEl.className = 'file-status'
  try {
    const raw   = await src.file.text()
    const outer = JSON.parse(raw)
    const [major] = (String(outer.morus || '')).split('.').map(Number)
    if (major !== 1) throw new Error(`Unsupported format version: ${outer.morus}`)
    const plain = await decrypt(pwd, outer.salt, outer.iv, outer.data, outer.iterations)
    const inner = JSON.parse(plain)
    if (inner.entries.length !== outer.count) throw new Error('count mismatch')
    if (inner.entries.length > 5000) throw new Error('too many entries')
    const chainOk = await verifyChain(inner.entries, inner.head)
    src.entries = inner.entries
    src.loaded  = true
    src.valid   = chainOk
    statusEl.textContent = chainOk
      ? `✓ ${inner.entries.length} records — chain intact`
      : `⚠ ${inner.entries.length} records — chain integrity warning`
    statusEl.className = `file-status ${chainOk ? 'ok' : 'err'}`
    renderTimeline()
    updateExportBtn()
  } catch (err) {
    const wrong = err.name === 'OperationError'
    statusEl.textContent = wrong
      ? '✗ Wrong password or file tampered with'
      : '✗ Could not read this file'
    statusEl.className = 'file-status err'
    btn.disabled = false; btn.textContent = 'Load'
  }
}

// ── Timeline rendering ────────────────────────────────────────────────────────
const CORR_WINDOW_MS = 5 * 60 * 1000  // 5 minutes

function buildTimeline() {
  const loaded = sources.filter(s => s.loaded)
  if (!loaded.length) return []

  // Flatten all entries with source info
  const all = []
  for (const src of loaded) {
    for (const e of src.entries) {
      all.push({ ...e, sourceId: src.id, color: src.color, label: src.label, ts: new Date(e.timestamp).getTime() })
    }
  }
  all.sort((a, b) => a.ts - b.ts)

  // Mark corroborating entries (from different sources within 5 min of each other)
  const corrSet = new Set()
  for (let i = 0; i < all.length; i++) {
    for (let j = i + 1; j < all.length; j++) {
      if (all[j].ts - all[i].ts > CORR_WINDOW_MS) break
      if (all[i].sourceId !== all[j].sourceId) {
        corrSet.add(i); corrSet.add(j)
      }
    }
  }

  return all.map((e, i) => ({ ...e, corroborating: corrSet.has(i) }))
}

function renderTimeline() {
  const wrap = document.getElementById('timeline-wrap')
  const loaded = sources.filter(s => s.loaded)
  if (!loaded.length) {
    wrap.innerHTML = `
      <div class="timeline-empty">
        <div class="timeline-empty-icon">📋</div>
        <div class="timeline-empty-title">No files loaded yet</div>
        <div class="timeline-empty-sub">Add .morus files on the left to see the timeline</div>
      </div>`
    return
  }

  const timeline = buildTimeline()
  const corrCount = timeline.filter(e => e.corroborating).length
  const totalEntries = timeline.length

  let html = `<div class="timeline-stats">`
  html += `<span class="stat"><strong>${loaded.length}</strong> witnesses</span>`
  html += `<span class="stat"><strong>${totalEntries}</strong> records</span>`
  if (corrCount) html += `<span class="corroborating-badge">◆ ${corrCount} corroborating entries</span>`
  html += `</div>`

  let lastWasCorr = false
  timeline.forEach((e, i) => {
    const isCorr = e.corroborating
    // Insert divider when entering a corroborating cluster
    if (isCorr && !lastWasCorr) {
      html += `<div class="corr-group-divider">◆ Accounts align here — different witnesses, same timeframe</div>`
    }
    html += `
      <div class="timeline-item${isCorr ? ' corroborating' : ''}">
        <div class="timeline-marker">
          <div class="timeline-dot" style="background:${e.color}"></div>
          ${isCorr ? '<div class="timeline-corr-icon">◆</div>' : ''}
        </div>
        <div class="timeline-body">
          <div class="timeline-text">${esc(e.text)}</div>
          <div class="timeline-meta">
            <span class="timeline-time">${fmtTime(e.timestamp)}</span>
            <span class="timeline-source" style="background:${e.color}22;color:${e.color}">${esc(e.label)}</span>
          </div>
        </div>
      </div>`
    lastWasCorr = isCorr
  })

  wrap.innerHTML = html
}

// ── Sidebar rendering ─────────────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('file-list')
  if (!sources.length) { list.innerHTML = ''; return }
  list.innerHTML = sources.map(src => `
    <div class="file-card" id="card-${src.id}">
      <div class="file-card-header">
        <div class="file-dot" style="background:${src.color}"></div>
        <span class="file-name" title="${esc(src.filename)}">${esc(src.label)} — ${esc(src.filename)}</span>
        <button class="file-remove" onclick="removeSource(${src.id})" title="Remove">×</button>
      </div>
      ${!src.loaded ? `
        <div class="file-card-body">
          <div class="file-pwd-row">
            <input class="file-pwd-input" id="pwd-${src.id}" type="password" placeholder="Password"
              onkeydown="if(event.key==='Enter')document.getElementById('load-${src.id}').click()">
            <button class="file-load-btn" id="load-${src.id}" onclick="loadSource(${src.id})">Load</button>
          </div>
          <div class="file-status" id="status-${src.id}"></div>
        </div>
      ` : `
        <div class="file-card-body">
          <div class="file-status ok" id="status-${src.id}">
            ${src.valid ? `✓ ${src.entries.length} records — chain intact` : `⚠ ${src.entries.length} records — chain warning`}
          </div>
        </div>
      `}
    </div>
  `).join('')
}

// ── Export ────────────────────────────────────────────────────────────────────
function updateExportBtn() {
  const hasLoaded = sources.some(s => s.loaded)
  document.getElementById('export-btn').disabled = !hasLoaded
}

function handleExport() {
  const loaded = sources.filter(s => s.loaded)
  if (!loaded.length) return
  const timeline = buildTimeline()
  const now = new Date()
  const corrCount = timeline.filter(e => e.corroborating).length

  // Build a self-contained printable HTML report
  const reportHtml = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Morus — Combined Witness Report</title>
<style>
  body { font-family: Georgia, 'Times New Roman', serif; max-width: 700px; margin: 40px auto; padding: 0 24px; color: #1a1a1a; line-height: 1.7; }
  h1 { font-size: 22px; font-weight: normal; letter-spacing: 0.05em; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #6b7280; margin-bottom: 32px; }
  .meta { font-size: 12px; color: #374151; margin-bottom: 24px; border-left: 3px solid #e5e7eb; padding-left: 16px; }
  .sources { margin-bottom: 28px; }
  .source-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 13px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  h2 { font-size: 16px; font-weight: 600; margin: 32px 0 16px; border-bottom: 1px solid #e5e7eb; padding-bottom: 8px; }
  .entry { display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid #f3f4f6; page-break-inside: avoid; }
  .entry.corr { background: #fffbeb; margin: 0 -8px; padding: 12px 8px; border-radius: 4px; border-bottom: 1px solid #fef3c7; }
  .entry-left { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .entry-dot { width: 12px; height: 12px; border-radius: 50%; }
  .corr-mark { font-size: 9px; color: #92400e; }
  .entry-right { flex: 1; min-width: 0; }
  .entry-text { font-size: 13px; margin-bottom: 4px; white-space: pre-wrap; word-break: break-word; }
  .entry-meta { font-size: 11px; color: #6b7280; font-family: 'Courier New', monospace; }
  .source-badge { font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 10px; }
  .corr-divider { margin: 6px 0; padding: 5px 12px; background: #fef3c7; border-left: 3px solid #f59e0b; font-size: 11px; color: #92400e; font-weight: 600; font-family: system-ui, sans-serif; }
  .footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid #e5e7eb; font-size: 11px; color: #9ca3af; }
  @media print { body { margin: 20px; } }
</style>
</head>
<body>
<div style="background:#fef3c7;border:1px solid #f59e0b;padding:12px 16px;margin-bottom:24px;font-family:system-ui,sans-serif;font-size:12px;border-radius:4px;">
  <strong>&#9888; This file contains unencrypted witness testimony.</strong>
  Store it as securely as the original .morus source files. The .morus files remain encrypted; this report does not.
</div>
<h1>MORUS — Combined Witness Report</h1>
<div class="sub">tamper-proof witness record</div>
<div class="meta">
  Generated: ${fmtTime(now.toISOString())}<br>
  Witnesses: ${loaded.length}<br>
  Total records: ${timeline.length}<br>
  Corroborating entries: ${corrCount}
</div>
<div class="sources">
  <strong style="font-size:13px;font-family:system-ui,sans-serif">Witnesses in this report:</strong><br><br>
  ${loaded.map(src => `
    <div class="source-row">
      <span class="dot" style="background:${src.color}"></span>
      <span style="font-weight:600">${esc(src.label)}</span>
      <span style="color:#6b7280;font-size:12px">${esc(src.filename)} — ${src.entries.length} records${!src.valid ? ' ⚠ chain warning' : ''}</span>
    </div>
  `).join('')}
</div>
<h2>Timeline</h2>
${(() => {
    let out = ''; let lastWasCorr = false
    timeline.forEach(e => {
      if (e.corroborating && !lastWasCorr) {
        out += `<div class="corr-divider">◆ Accounts align — different witnesses, same timeframe (within 5 minutes)</div>`
      }
      out += `
        <div class="entry${e.corroborating ? ' corr' : ''}">
          <div class="entry-left">
            <div class="entry-dot" style="background:${e.color}"></div>
            ${e.corroborating ? '<div class="corr-mark">◆</div>' : ''}
          </div>
          <div class="entry-right">
            <div class="entry-text">${esc(e.text)}</div>
            <div class="entry-meta">
              ${fmtTime(e.timestamp)} &nbsp;·&nbsp;
              <span class="source-badge" style="background:${e.color}22;color:${e.color}">${esc(e.label)}</span>
            </div>
          </div>
        </div>`
      lastWasCorr = e.corroborating
    })
    return out
  })()}
<div class="footer">
  This report was generated by Morus — tamper-proof witness record protocol.<br>
  Each .morus source file can be individually verified using witness.html.<br>
  Named for Thomas More (Morus), executed 1535 because one testimony could be fabricated with no proof.
</div>
</body>
</html>`

  const blob = new Blob([reportHtml], { type: 'text/html' })
  const url  = URL.createObjectURL(blob)
  const a = Object.assign(document.createElement('a'), {
    href: url,
    download: `morus-report-${now.toISOString().slice(0,10)}.html`
  })
  document.body.appendChild(a); a.click(); document.body.removeChild(a)
  URL.revokeObjectURL(url)
  showToast('Report exported — open it in any browser to print')
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#x27;')
}
function fmtTime(iso) {
  try {
    return new Date(iso).toLocaleString(undefined, {
      year:'numeric', month:'short', day:'numeric',
      hour:'2-digit', minute:'2-digit', second:'2-digit'
    })
  } catch { return esc(String(iso)) }
}

let _toastTimer = null
function showToast(msg) {
  const el = document.getElementById('toast')
  el.textContent = msg; el.classList.add('show')
  clearTimeout(_toastTimer)
  _toastTimer = setTimeout(() => el.classList.remove('show'), 3800)
}

// ── Event wiring ──────────────────────────────────────────────────────────────
const dropZone = document.getElementById('drop-zone')
const fileInput = document.getElementById('file-input')

dropZone.addEventListener('click', () => fileInput.click())
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover') })
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'))
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('dragover')
  addFiles(Array.from(e.dataTransfer.files))
})
fileInput.addEventListener('change', e => {
  addFiles(Array.from(e.target.files)); fileInput.value = ''
})
document.getElementById('export-btn').addEventListener('click', handleExport)
</script>
